<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitFindr</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Secondhand styling agent</p>
        <h1>FitFindr</h1>
      </div>
      <button id="wardrobe-button" class="button secondary" type="button">My
        wardrobe</button>
    </header>

    <main>
      <section class="search-card" aria-labelledby="search-title">
        <h2 id="search-title">What are you looking for?</h2>
        <form id="search-form">
          <label for="query">Describe the item</label>
          <input id="query" name="query" type="text" required
            placeholder="vintage graphic tee" autocomplete="off">

          <div class="search-options">
            <div>
              <label for="size">Size <span>(optional)</span></label>
              <input id="size" name="size" type="text" placeholder="M">
            </div>
            <div>
              <label for="budget">Budget <span>(optional)</span></label>
              <input id="budget" name="budget" type="number" min="1" step="1"
                placeholder="30">
            </div>
          </div>

          <button id="search-button" class="button primary" type="submit">Find
            my fit</button>
        </form>
      </section>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section id="recommendation" class="recommendation" hidden></section>

      <section id="results-section" class="results-section" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Matching listings</p>
            <h2>Choose a result</h2>
          </div>
          <select id="category-filter" aria-label="Filter results by category">
            <option value>All categories</option>
            <option value="tops">Tops</option>
            <option value="bottoms">Bottoms</option>
            <option value="outerwear">Outerwear</option>
            <option value="shoes">Shoes</option>
            <option value="accessories">Accessories</option>
          </select>
        </div>
        <div id="results" class="results-grid"></div>
      </section>

      <section id="saved-section" class="saved-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Your collection</p>
            <h2>Saved listings</h2>
          </div>
        </div>
        <div id="saved-results" class="results-grid"></div>
      </section>
    </main>

    <dialog id="wardrobe-dialog">
      <form id="wardrobe-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">Closet</p>
            <h2>Edit wardrobe</h2>
          </div>
          <button id="close-wardrobe" class="icon-button" type="button"
            aria-label="Close">×</button>
        </div>

        <label for="item-name">Item name</label>
        <input id="item-name" required placeholder="Black leather boots">

        <label for="item-category">Category</label>
        <select id="item-category" required>
          <option value="tops">Tops</option>
          <option value="bottoms">Bottoms</option>
          <option value="outerwear">Outerwear</option>
          <option value="shoes">Shoes</option>
          <option value="accessories">Accessories</option>
        </select>

        <label for="item-colors">Colors <span>(comma-separated)</span></label>
        <input id="item-colors" required placeholder="black, brown">

        <label for="item-tags">Style tags <span>(comma-separated)</span></label>
        <input id="item-tags" placeholder="grunge, classic">

        <label for="item-notes">Notes</label>
        <textarea id="item-notes" rows="2"
          placeholder="Mid-ankle and lace-up"></textarea>
        <input id="item-id" type="hidden">

        <div class="dialog-actions">
          <button id="reset-wardrobe" class="button secondary"
            type="button">Reset example</button>
          <button class="button primary" type="submit">Save item</button>
        </div>
      </form>
      <div id="wardrobe-items" class="wardrobe-items"></div>
    </dialog>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
